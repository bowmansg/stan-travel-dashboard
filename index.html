<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stan Travel Dashboard</title>
<!-- dashboard-version: 2026-06-08-v7-short-rental-summary-rich-details -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --page:#f4f4f2; --panel:#ffffff; --card:#f1f1ef; --ink:#111111; --muted:#555b61; --muted2:#7b8086;
  --line:#d7d9d5; --soft:#e9e9e5; --shadow:0 10px 26px rgba(15,23,42,.065);
  --ua:#0b66d8; --car:#0f7a3e; --hotel:#0b7d63; --ice:#111827; --note:#7c3aed;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:10px}
.status{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center;color:#70757a;font-weight:800}
.error{background:#fff2f0;border-color:#ffc9c2;color:#b42318}
.topbar,.section{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.topbar{padding:16px;margin-bottom:12px}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{margin:0;font-size:31px;line-height:1.02;letter-spacing:-1.2px;font-weight:900}
.date-range{font-size:16px;font-weight:850;color:#3f4348;white-space:nowrap;padding-top:3px}
.subline{margin-top:8px;color:var(--muted2);font-size:13px;font-weight:850;line-height:1.35}
.section{padding:14px;margin-bottom:12px}
.section-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.iconbox{width:44px;height:44px;border-radius:16px;background:#f1f2f0;display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid var(--soft);flex:0 0 auto}
.section-head h2{margin:0;font-size:23px;line-height:1.05;letter-spacing:-.65px;font-weight:900}
.section-head p{margin:2px 0 0;color:#555b61;font-size:14px;font-weight:800}
.card{background:var(--card);border:1px solid var(--soft);border-radius:18px;padding:13px;margin-top:9px}
.label{display:flex;align-items:center;gap:9px;margin-bottom:10px;color:#6f7479;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.brand{width:31px;height:31px;border-radius:9px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;letter-spacing:.02em;flex:0 0 auto;background:#111827}
.flight{background:var(--ua)} .car{background:var(--car)} .hotel{background:var(--hotel)} .ice{background:var(--ice)} .note{background:var(--note)}
.big{font-size:20px;line-height:1.14;font-weight:900;letter-spacing:-.35px}
.med{font-size:16px;line-height:1.3;font-weight:850;color:#3f444a;margin-top:5px}
.small{font-size:14px;line-height:1.35;font-weight:750;color:#545a60;margin-top:4px}
.confirmation{margin-top:13px;font-size:25px;line-height:1.05;letter-spacing:.05em;font-weight:900;color:#0d0d0d}
.divider{height:1px;background:#ddddda;margin:11px 0}
.summary-list{display:grid;gap:9px}
.summary-row{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid #dedfdb}
.summary-row:first-child{border-top:0;padding-top:0}
.summary-time{font-weight:900;font-size:15px;line-height:1.25;white-space:nowrap}
.summary-title{font-weight:900;font-size:16px;line-height:1.2;letter-spacing:-.2px}
.summary-sub{font-size:12px;color:#555b61;font-weight:750;line-height:1.25;margin-top:2px}
.kv{font-size:15px;line-height:1.35;font-weight:800;color:#40464d;margin-top:5px}
.route{font-size:17px;line-height:1.25;font-weight:900;letter-spacing:-.2px;margin-top:10px}
.timeblock{font-size:16px;line-height:1.3;font-weight:850;color:#30363d;margin-top:8px}
.linkline{display:block;margin-top:9px;font-size:15px;line-height:1.35;font-weight:850;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.phone{margin-top:4px}
.detail-row{padding:10px 0;border-top:1px solid #dedfdb}
.detail-row:first-child{border-top:0;padding-top:0}
.detail-title{font-size:18px;font-weight:900;letter-spacing:-.25px;line-height:1.2}
.detail-meta{font-size:14px;font-weight:800;color:#4f555b;line-height:1.35;margin-top:3px}
.passenger-line{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:13px;color:#4f555b;font-weight:800}
.passenger-code{font-size:14px;color:#111;font-weight:900;white-space:nowrap}
.extra-lines{margin-top:8px;display:grid;gap:5px}
.extra-line{font-size:13px;line-height:1.3;color:#4f555b;font-weight:800}
.extra-line strong{color:#111;font-weight:900}
.ice-tight .summary-row{grid-template-columns:76px 54px 1fr;gap:8px;align-items:baseline;padding:6px 0}
.ice-date{font-size:13px;font-weight:900;line-height:1.15;white-space:nowrap}
.ice-time{font-size:13px;font-weight:900;line-height:1.15;white-space:nowrap}
.ice-tight .summary-title{font-size:14px;line-height:1.15}
.footer{text-align:center;color:#8b9095;font-size:11px;font-weight:700;margin:16px 0 8px}
.empty{background:var(--panel);border:1px dashed #c8cac7;border-radius:18px;padding:14px;color:#70757a;text-align:center;font-weight:800}
@media(max-width:720px){
  .wrap{padding:8px}
  .topbar,.section{border-radius:20px}
  .topbar{padding:13px}
  .topline{display:block}
  h1{font-size:27px}
  .date-range{font-size:14px;margin-top:5px}
  .section{padding:12px}
  .iconbox{width:40px;height:40px;border-radius:14px;font-size:22px}
  .section-head h2{font-size:22px}
  .card{padding:12px;border-radius:17px}
  .summary-row{grid-template-columns:72px 1fr;gap:8px}
  .confirmation{font-size:24px}
}
@media(max-width:410px){
  .summary-row{grid-template-columns:67px 1fr}
  .summary-time{font-size:14px}
  .summary-title{font-size:15px}
  .big{font-size:19px}
}
</style>
</head>
<body><main class="wrap"><div id="app" class="status">Loading travel dashboard…</div></main>
<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzn6c3le10KvB6YX6P62eNvnf2SU9zwE7P1pQaADgOTmnUXuFuwOw50dOUet21N2CGu/exec";
const params = new URLSearchParams(window.location.search);
const tripId = params.get("trip") || params.get("tripId") || "test-trip";

function val(x){return x===undefined||x===null?"":String(x).trim()}
function has(x){return val(x).length>0}
function esc(x){return val(x).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function toTitleCase(s){return val(s).toLowerCase().replace(/\b([a-z])/g,c=>c.toUpperCase()).replace(/\bUsa\b/g,"USA")}
function deCapsName(s){const raw=val(s); if(!raw)return ""; return raw===raw.toUpperCase()?toTitleCase(raw):raw}
function formatDate(dateStr, opts={}){const s=val(dateStr); if(!s)return ""; const p=s.split("-"); if(p.length===3){const d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); return d.toLocaleDateString(undefined,{weekday:opts.weekday?"short":undefined,month:"short",day:"numeric",year:opts.year?"numeric":undefined})} return s}
function compactDate(s){return formatDate(s,{})}
function dateRange(start,end){const a=compactDate(start),b=compactDate(end); if(a&&b&&a!==b)return `${a} – ${b}, ${val(start).slice(0,4)}`; return a||b||""}
function dateArrow(start,end){const a=formatDate(start,{weekday:true}),b=formatDate(end,{weekday:true}); if(a&&b&&a!==b)return `${a} → ${b}`; return a||b||""}
function nights(start,end){const a=val(start).split("-"),b=val(end).split("-"); if(a.length!==3||b.length!==3)return ""; const d1=new Date(+a[0],+a[1]-1,+a[2]); const d2=new Date(+b[0],+b[1]-1,+b[2]); const n=Math.round((d2-d1)/(86400000)); return n>0?`${n} night${n===1?"":"s"}`:""}
function initialsName(name){const s=val(name).replace(/;/g,","); if(!s)return ""; return s.split(",").map(p=>p.trim()).filter(Boolean).map(p=>{p=deCapsName(p); const w=p.split(/\s+/).filter(Boolean); if(w.length===1)return w[0]; return `${w[0][0]}. ${w[w.length-1]}`}).join(" / ")}
function cleanAirportName(x,fallback){let s=val(x); if(!s)return fallback||""; s=s.replace(/\bUnited States\b/ig,"").replace(/\bUSA\b/g,"").replace(/,\s*,/g,",").replace(/,\s*$/,"").trim(); const code=airportCode(s); let name=s.replace(/[()]/g,"").replace(new RegExp(`\\b${code}\\b`,"g"),"").replace(/\s+/g," ").replace(/,\s*$/,"").trim(); if(name.length>34)name=name.split(",")[0]; if(/^airport$/i.test(name)||!name)name=fallback||"Airport"; if(code && !name.toUpperCase().includes(code))return `${name} (${code})`; return name||code||fallback||""}
function airportCode(x){const s=val(x); const p=s.match(/\(([A-Z]{3})\)/); if(p)return p[1]; const m=s.match(/\b[A-Z]{3}\b/); return m?m[0]:""}
function airportPretty(code){const m={BUF:"Buffalo Airport",ROC:"Rochester Airport",ORD:"Chicago O’Hare",BOS:"Boston Logan",PVD:"Providence Airport",DTW:"Detroit Metro",MDW:"Chicago Midway",YYZ:"Toronto Pearson",YUL:"Montréal Trudeau",LGA:"LaGuardia",JFK:"JFK",EWR:"Newark",MSP:"Minneapolis–Saint Paul",DEN:"Denver",LAX:"Los Angeles",SFO:"San Francisco",SEA:"Seattle–Tacoma",PHX:"Phoenix",DFW:"Dallas/Fort Worth",IAH:"Houston Intercontinental",IAD:"Washington Dulles",DCA:"Reagan National",BWI:"Baltimore/Washington",ATL:"Atlanta",CLT:"Charlotte",MCO:"Orlando",TPA:"Tampa",FLL:"Fort Lauderdale",MIA:"Miami"};return m[val(code).toUpperCase()]||""}
function airportDisplay(location,fallback){const code=airportCode(location)||airportCode(fallback); let name=cleanAirportName(location,fallback); const pretty=airportPretty(code); if(code && (name==="Airport"||name===`${code} Airport`||name===`Airport (${code})`||/^airport/i.test(name)||val(location).toUpperCase()===code)) return `${pretty||name||"Airport"} (${code})`; return name}
function airportSummaryLabel(location,fallback){const code=airportCode(location)||airportCode(fallback); const pretty=airportPretty(code); if(code)return `${pretty||cleanAirportName(location,fallback)||"Airport"} (${code})`; return cleanAirportName(location,fallback)}
function firstVal(obj,keys){for(const k of keys){if(has(obj&&obj[k]))return val(obj[k])}return ""}
function moneyVal(x){return val(x).replace(/^\$/,'$')}
function detailLine(label,value){return has(value)?`<div class="extra-line"><strong>${esc(label)}:</strong> ${esc(value)}</div>`:""}
function detailLinkLine(label,value,href){return has(value)?`<div class="extra-line"><strong>${esc(label)}:</strong> <a href="${esc(href)}" target="_blank" rel="noopener">${esc(value)}</a></div>`:""}
function addressHtml(address){const a=cleanAddress(address); if(!a)return ""; const parts=a.split(/,\s*/).filter(Boolean); if(parts.length>=3){return `${esc(parts[0])}<br>${esc(parts.slice(1).join(", "))}`} return esc(a)}
function cleanCodeLabel(x,fallback){return airportCode(x)||val(fallback)||""}
function cleanHotelName(x){let s=val(x)||"Hotel"; return s.replace(/\s+by\s+Marriott\b/ig,"").replace(/\s+by\s+Hilton\b/ig,"").replace(/\s+by\s+IHG\b/ig,"").replace(/\s+/g," ").trim()}
function cleanAddress(a){return val(a).replace(/\bUnited States\b/ig,"").replace(/\bUSA\b/g,"").replace(/,\s*,/g,",").replace(/,\s*$/,"").trim()}
function mapsHref(a){a=cleanAddress(a); return a?`https://maps.apple.com/?q=${encodeURIComponent(a)}`:""}
function phoneDigits(p){return val(p).replace(/[^0-9+]/g,"")}
function airlineBrand(a){const s=val(a).toUpperCase(); if(s.includes("UNITED"))return "UA"; if(s.includes("AMERICAN"))return "AA"; if(s.includes("DELTA"))return "DL"; return (a||"FL").slice(0,2).toUpperCase()}
function section(icon,title,sub,body){return `<section class="section"><div class="section-head"><div class="iconbox">${icon}</div><div><h2>${esc(title)}</h2>${has(sub)?`<p>${esc(sub)}</p>`:""}</div></div>${body}</section>`}
function brand(cls,txt){return `<span class="brand ${cls}">${esc(txt)}</span>`}
function route(f){return [f.fromCode,f.toCode].filter(has).join(" → ")}
function flightName(f){return [f.airline,f.flightNumber].filter(has).join(" ")}
function groupFlights(flights){const m=new Map(); flights.forEach(f=>{const k=[f.date,f.airline,f.flightNumber,f.fromCode,f.toCode,f.departTime,f.arriveTime].map(val).join("|"); if(!m.has(k))m.set(k,{base:f,items:[]}); m.get(k).items.push(f)}); return [...m.values()]}
function passengerLine(f){const who=initialsName(f.traveler)||""; const pieces=[]; if(has(f.confirmation))pieces.push(esc(f.confirmation)); if(has(f.seat))pieces.push(`Seat ${esc(f.seat)}`); if(!who&&!pieces.length)return ""; return `<div class="passenger-line"><span>${esc(who||"Traveler")}</span><span class="passenger-code">${pieces.join(" · ")}</span></div>`}

function carCompany(c){return val(c.company)||val(c.rentalCompany)||val(c.rentalCompanyName)||"Rental Car"}
function carBits(c){
  const pickCode=cleanCodeLabel(c.pickupLocation||c.pickupCode||c.pickupAirport,"");
  const retCode=cleanCodeLabel(c.returnLocation||c.returnCode||c.returnAirport,"");
  const pickFull=airportDisplay(c.pickupLocation||c.pickupName||c.pickupAirport,"Airport");
  const retFull=airportDisplay(c.returnLocation||c.returnName||c.returnAirport,"Airport");
  const pickShort=airportSummaryLabel(c.pickupLocation||c.pickupName||c.pickupAirport,"Airport");
  const retShort=airportSummaryLabel(c.returnLocation||c.returnName||c.returnAirport,"Airport");
  const pickupLine=`${compactDate(c.pickupDate)}${has(c.pickupTime)?", "+val(c.pickupTime):""}${has(pickCode)?` (${pickCode})`:""}`.trim();
  const returnLine=`${compactDate(c.returnDate)}${has(c.returnTime)?", "+val(c.returnTime):""}${has(retCode)?` (${retCode})`:""}`.trim();
  const vehicle=firstVal(c,["carClass","vehicle","vehicleType","vehicleClass","carType"]);
  const example=firstVal(c,["vehicleExample","carExample","exampleVehicle"]);
  return {pickFull,retFull,pickShort,retShort,pickCode,retCode,pickupLine,returnLine,vehicle,example,company:carCompany(c)};
}
function hotelBits(h){
  const rawAddress=cleanAddress(h.address||[h.street,h.city,h.state,h.zip].filter(has).join(", "));
  return {
    name:cleanHotelName(h.hotelName||h.name),
    dates:dateArrow(h.checkInDate||h.checkIn,h.checkOutDate||h.checkOut),
    room:val(h.roomType)||val(h.room)||"",
    address:rawAddress,
    phone:val(h.phone||h.phoneNumber),
    conf:val(h.confirmation)
  };
}

function isIceItem(s){const text=[s.title,s.type,s.notes,s.location,s.opponent].map(val).join(" ").toLowerCase(); return /(game|skills|practice|team ice|hockey|victorie|victoire|rink|iceplex|opponent|vs\s+)/i.test(text)}
function cleanOpponent(txt){return val(txt).replace(/^(game\s+)?vs\s+/i,"").replace(/^game\s+/i,"").replace(/^with\s+/i,"").trim()}
function cleanIceType(s){const text=[s.type,s.title].map(val).join(" ").toLowerCase(); if(text.includes("skills"))return "Skills"; if(text.includes("practice"))return "Practice"; if(text.includes("team ice"))return "Team Ice"; if(text.includes("game")||/\bvs\b/i.test(val(s.title)))return "Game"; return toTitleCase(s.type||"Ice")}
function cleanIceTitle(s){
  const type=cleanIceType(s);
  let title=val(s.title)||val(s.opponent)||type;
  title=title.replace(/\s+/g," ").trim();
  title=title.replace(/^(vs\s+)?game\s+vs\s+/i,"Game vs ");
  title=title.replace(/^vs\s+/i,"Game vs ");
  if(type==="Game"){
    const opp=cleanOpponent(title);
    return opp && !/^game$/i.test(opp)?`Game (${opp})`:"Game";
  }
  if(type==="Practice"){
    let who=title.replace(/^practice\s*(with|[-–—])?\s*/i,"").trim();
    return who && !/^practice$/i.test(who)?`Practice (${who})`:"Practice";
  }
  if(type==="Skills"){
    let who=title.replace(/^skills\s*(with|[-–—])?\s*/i,"").trim();
    return who && !/^skills$/i.test(who)?`Skills (${who})`:"Skills";
  }
  return type;
}


function flightExtras(f){
  const pairs = [
    ["Aircraft", f.aircraft || f.planeType || f.equipment],
    ["Flight time", f.duration || f.flightTime],
    ["Departure terminal", f.departTerminal || f.departureTerminal],
    ["Arrival terminal", f.arriveTerminal || f.arrivalTerminal],
    ["Gate", f.gate],
    ["Boarding", f.boardingTime],
    ["Baggage", f.baggage || f.baggageClaim],
    ["Notes", f.notes]
  ];
  return pairs
    .filter(([label,value]) => has(value))
    .map(([label,value]) => `<div class="extra-line"><strong>${esc(label)}:</strong> ${esc(value)}</div>`)
    .join("");
}

function renderFlightSummary(flights){
  if(!flights.length)return "";
  const groups=groupFlights(flights);
  const rows=groups.map(g=>{const f=g.base; return `<div class="detail-row"><div class="detail-title">${esc(flightName(f)||"Flight")} · ${esc(route(f))}</div><div class="detail-meta">${esc(compactDate(f.date))}${has(f.departTime)?" · "+esc(f.departTime):""}${has(f.arriveTime)?" → "+esc(f.arriveTime):""}</div>${g.items.map(passengerLine).filter(Boolean).join("")}</div>`}).join("");
  return section("✈️","Flight Executive Summary","Airport quick view",`<div class="card"><div class="label">${brand("flight",airlineBrand(flights[0].airline))}<span>Flight Summary</span></div>${rows}</div>`);
}
function renderRentalSummary(cars){
  if(!cars.length)return "";
  const body=cars.map(c=>{const b=carBits(c); return `<div class="card"><div class="label">${brand("car","CAR")}<span>Rental Car${b.company&&b.company!=="Rental Car"?" · "+esc(b.company):""}</span></div>
    <div class="kv"><strong>Pickup:</strong> ${esc(b.pickShort)}</div>
    <div class="kv"><strong>Return:</strong> ${esc(b.retShort)}</div>
    <div class="route">${esc(b.pickCode||"Pickup")} pickup → ${esc(b.retCode||"Return")} return</div>
    <div class="timeblock">${esc(b.pickupLine)} → ${esc(b.returnLine)}</div>
    ${has(c.confirmation)?`<div class="confirmation">${esc(c.confirmation)}</div>`:""}
  </div>`}).join("");
  return section("🚗","Rental Car Executive Summary","Pickup and return",body);
}
function renderHotelSummary(hotels){
  if(!hotels.length)return "";
  const body=hotels.map(h=>{const b=hotelBits(h); const digits=phoneDigits(b.phone); const addrHtml=addressHtml(b.address); return `<div class="card"><div class="label">${brand("hotel","HTL")}<span>Hotel</span></div>
    <div class="big">${esc(b.name)}</div>
    ${has(b.dates)?`<div class="med">${esc(b.dates)}</div>`:""}
    ${has(b.room)?`<div class="small">${esc(b.room)}</div>`:""}
    ${has(b.address)?`<a class="linkline" href="${esc(mapsHref(b.address))}" target="_blank" rel="noopener">${addrHtml}</a>`:""}
    ${has(b.phone)?`<a class="linkline phone" href="tel:${esc(digits)}">${esc(b.phone)}</a>`:""}
    ${has(b.conf)?`<div class="confirmation">${esc(b.conf)}</div>`:""}
  </div>`}).join("");
  return section("🏨","Hotel Executive Summary","Stay quick view",body);
}
function renderIceSummary(items){
  if(!items.length)return "";
  const rows=[...items].sort((a,b)=>[val(a.date),val(a.time)].join(" ").localeCompare([val(b.date),val(b.time)].join(" "))).map(s=>{
    const d=formatDate(s.date,{weekday:true}).replace(",","");
    return `<div class="summary-row"><div class="ice-date">${esc(d)}</div><div class="ice-time">${esc(s.time)}</div><div><div class="summary-title">${esc(cleanIceTitle(s))}</div></div></div>`
  }).join("");
  return section("🏒","Ice Schedule","Team ice and games",`<div class="card ice-tight"><div class="label">${brand("ice","ICE")}<span>Schedule</span></div>${rows}</div>`);
}
function renderFlightDetail(flights){
  if(!flights.length)return "";
  const rows=groupFlights(flights).map(g=>{const f=g.base; return `<div class="detail-row"><div class="detail-title">${esc(flightName(f)||"Flight")} · ${esc(route(f))}</div><div class="detail-meta">${esc(compactDate(f.date))}${has(f.departTime)?" · "+esc(f.departTime):""}${has(f.arriveTime)?" → "+esc(f.arriveTime):""}</div>${g.items.map(passengerLine).filter(Boolean).join("")}${flightExtras(f)?`<div class="extra-lines">${flightExtras(f)}</div>`:""}</div>`}).join("");
  return section("✈️","Flight Detail",flights[0].airline||"",`<div class="card"><div class="label">${brand("flight",airlineBrand(flights[0].airline))}<span>Flight Detail</span></div>${rows}</div>`);
}
function renderRentalDetail(cars){
  if(!cars.length)return "";
  const body=cars.map(c=>{
    const b=carBits(c);
    const pickupName=firstVal(c,["pickupName","pickupLocationName","pickupAirportName"])||b.pickFull;
    const returnName=firstVal(c,["returnName","returnLocationName","returnAirportName"])||b.retFull;
    const pickupAddress=firstVal(c,["pickupAddress","pickupStreetAddress","pickupFullAddress","pickupLocationAddress"]);
    const returnAddress=firstVal(c,["returnAddress","returnStreetAddress","returnFullAddress","returnLocationAddress"]);
    const pickupPhone=firstVal(c,["pickupPhone","pickupPhoneNumber","pickupLocationPhone"]);
    const returnPhone=firstVal(c,["returnPhone","returnPhoneNumber","returnLocationPhone"]);
    const account=firstVal(c,["accountNumber","account","corporateAccount","discountCode","rateCode"]);
    const transmission=firstVal(c,["transmission"]);
    const extras=firstVal(c,["includedExtras","extras","included","coverage","damageWaiver"]);
    const mileage=firstVal(c,["mileage","mileageDetails","unlimitedMileage"]);
    const cost=firstVal(c,["cost","rentalCost","totalCost","total","price"]);
    const instructions=firstVal(c,["instructions","pickupInstructions","returnInstructions"]);
    const notes=firstVal(c,["detailNotes","details","notes"]);
    return `<div class="card"><div class="label">${brand("car","CAR")}<span>Rental Detail${b.company&&b.company!=="Rental Car"?" · "+esc(b.company):""}</span></div>
      <div class="route">${esc(b.pickCode||"Pickup")} pickup → ${esc(b.retCode||"Return")} return</div>
      <div class="timeblock">${esc(b.pickupLine)} → ${esc(b.returnLine)}</div>
      ${has(account)?`<div class="extra-lines">${detailLine("Account",account)}</div>`:""}
      <div class="extra-lines">
        ${detailLine("Pickup",pickupName)}
        ${has(pickupAddress)?detailLinkLine("Pickup address",pickupAddress,mapsHref(pickupAddress)):""}
        ${has(pickupPhone)?`<div class="extra-line"><strong>Pickup phone:</strong> <a href="tel:${esc(phoneDigits(pickupPhone))}">${esc(pickupPhone)}</a></div>`:""}
        ${detailLine("Return",returnName)}
        ${has(returnAddress)?detailLinkLine("Return address",returnAddress,mapsHref(returnAddress)):""}
        ${has(returnPhone)?`<div class="extra-line"><strong>Return phone:</strong> <a href="tel:${esc(phoneDigits(returnPhone))}">${esc(returnPhone)}</a></div>`:""}
        ${has(b.vehicle)||has(b.example)?detailLine("Vehicle",[b.vehicle,b.example].filter(has).join(" — ")):""}
        ${detailLine("Transmission",transmission)}
        ${detailLine("Included extras",extras)}
        ${detailLine("Mileage",mileage)}
        ${detailLine("Cost",cost)}
        ${detailLine("Instructions",instructions)}
        ${detailLine("Notes",notes)}
      </div>
      ${has(c.confirmation)?`<div class="confirmation">${esc(c.confirmation)}</div>`:""}
    </div>`}).join("");
  return section("🚗","Rental Detail","Reservation details",body);
}
function renderHotelDetail(hotels){
  if(!hotels.length)return "";
  const body=hotels.map(h=>{
    const b=hotelBits(h); const digits=phoneDigits(b.phone); const addrHtml=addressHtml(b.address);
    const fullName=firstVal(h,["fullHotelName","marketingName"])||val(h.hotelName||h.name)||b.name;
    const checkInTime=firstVal(h,["checkInTime","checkinTime"]);
    const checkOutTime=firstVal(h,["checkOutTime","checkoutTime"]);
    const roomCount=firstVal(h,["roomCount","rooms"]);
    const guestCount=firstVal(h,["guestCount","guests"]);
    const totalStay=firstVal(h,["totalStay","totalCost","total","cost","price"]);
    const hotelNotes=firstVal(h,["detailNotes","details","notes"]);
    const nightCount=firstVal(h,["nights","numberOfNights"])||nights(h.checkInDate||h.checkIn,h.checkOutDate||h.checkOut);
    return `<div class="card"><div class="label">${brand("hotel","HTL")}<span>Hotel Detail</span></div>
      <div class="big">${esc(fullName)}</div>
      ${has(b.dates)?`<div class="med">${esc(b.dates)}</div>`:""}
      ${has(b.room)?`<div class="small">${esc(b.room)}</div>`:""}
      ${has(b.address)?`<a class="linkline" href="${esc(mapsHref(b.address))}" target="_blank" rel="noopener">${addrHtml}</a>`:""}
      ${has(b.phone)?`<a class="linkline phone" href="tel:${esc(digits)}">${esc(b.phone)}</a>`:""}
      <div class="extra-lines">
        ${detailLine("Check-in",checkInTime)}
        ${detailLine("Check-out",checkOutTime)}
        ${detailLine("Nights",nightCount)}
        ${detailLine("Rooms",roomCount)}
        ${detailLine("Guests",guestCount)}
        ${detailLine("Total stay",totalStay)}
        ${detailLine("Notes",hotelNotes)}
      </div>
      ${has(b.conf)?`<div class="confirmation">${esc(b.conf)}</div>`:""}
    </div>`}).join("");
  return section("🏨","Hotel Detail","Property details",body);
}
function renderDaily(items){if(!items.length)return ""; const rows=items.map(s=>`<div class="summary-row"><div class="summary-time">${esc(formatDate(s.date,{weekday:true}).replace(",", ""))}<br>${esc(s.time)}</div><div><div class="summary-title">${esc(s.title||s.type||"Schedule Item")}</div>${has(s.location)?`<div class="summary-sub">${esc(s.location)}</div>`:""}</div></div>`).join(""); return section("📅","Daily Schedule","Optional activities",`<div class="card">${rows}</div>`)}
function renderNotes(notes){if(!notes.length)return ""; const body=notes.map(n=>`<div class="card"><div class="big">${esc(n.title||"Note")}</div>${has(n.category)?`<div class="small">${esc(n.category)}</div>`:""}${has(n.note)?`<div class="small">${esc(n.note)}</div>`:""}</div>`).join(""); return section("📝","Notes","Trip notes",body)}

function render(data){
  const trip=data.trip||{}, flights=data.flights||[], cars=data.rentalCars||[], hotels=data.hotels||[], schedule=data.schedule||[], notes=data.notes||[];
  if(!data.trip){document.getElementById("app").className="status error";document.getElementById("app").innerHTML=`Trip not found for <strong>${esc(tripId)}</strong>.<br>Check the Trips tab and tripId.`;return}
  const ice=schedule.filter(isIceItem);
  const daily=schedule.filter(s=>!isIceItem(s));
  document.getElementById("app").className="";
  const top=`<div class="topbar"><div class="topline"><h1>${esc(trip.tripName||trip.primaryCity||"Trip")}</h1><div class="date-range">${esc(dateRange(trip.startDate,trip.endDate))}</div></div><div class="subline">${esc(deCapsName(trip.traveler)||"")}</div></div>`;
  const summaries=`${renderFlightSummary(flights)}${renderRentalSummary(cars)}${renderHotelSummary(hotels)}${renderIceSummary(ice)}`;
  const details=`${renderFlightDetail(flights)}${renderRentalDetail(cars)}${renderHotelDetail(hotels)}`;
  const empty=(!flights.length&&!cars.length&&!hotels.length&&!ice.length)?`<section class="section"><div class="empty">No reservation details added yet.</div></section>`:"";
  document.getElementById("app").innerHTML=`${top}${summaries}${details}${empty}${renderDaily(daily)}${renderNotes(notes)}<div class="footer">Travel dashboard powered by GitHub Pages + Google Sheets · v7</div>`;
}
async function loadTrip(){try{const res=await fetch(`${WEB_APP_URL}?action=trip&tripId=${encodeURIComponent(tripId)}`); if(!res.ok)throw new Error("Network response was not ok"); const json=await res.json(); if(!json.ok)throw new Error(json.error||"Unknown error"); render(json.data)}catch(err){document.getElementById("app").className="status error";document.getElementById("app").innerHTML=`Could not load trip data.<br><br>${esc(err.message)}`;}}
loadTrip();
</script></body></html>
