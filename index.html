<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stan Travel Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--page:#f4f4f2;--panel:#fff;--card:#f1f1ef;--ink:#121212;--muted:#5d6268;--muted2:#81868b;--line:#dcdedb;--softline:#e9e9e6;--black:#111827;--shadow:0 12px 34px rgba(15,23,42,.07);--ua:#0b66d8;--ent:#0f7a3e;--hotel:#0b7d63}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.wrap{width:100%;max-width:820px;margin:0 auto;padding:14px}.topbar{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px 18px 16px;margin-bottom:14px}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}h1{margin:0;font-size:32px;line-height:1.02;letter-spacing:-1.25px;font-weight:900}.date-range{font-size:17px;font-weight:800;color:#3f4348;white-space:nowrap;padding-top:4px}.subline{color:var(--muted2);font-size:14px;font-weight:700;line-height:1.35}.executive{background:var(--panel);border:1px solid #d4d6d2;border-radius:28px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}.section-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.iconbox{width:52px;height:52px;border-radius:18px;background:#f0f1ef;display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto;border:1px solid var(--softline)}.section-head h2{margin:0;font-size:24px;line-height:1.05;letter-spacing:-.7px;font-weight:900}.section-head p{margin:2px 0 0;color:#52565b;font-weight:800;font-size:16px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.info-tile{background:var(--card);border:1px solid var(--softline);border-radius:20px;padding:14px;min-height:104px}.eyebrow{color:#74787e;font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;margin-bottom:8px}.tile-main{font-size:21px;line-height:1.13;letter-spacing:-.45px;font-weight:900}.tile-sub{margin-top:6px;color:#4f5358;font-size:16px;line-height:1.24;font-weight:700}.big-card{background:var(--card);border:1px solid var(--softline);border-radius:22px;padding:14px;margin-top:10px}.card-label{display:flex;align-items:center;gap:10px;color:#6f7377;font-size:14px;text-transform:uppercase;letter-spacing:.075em;font-weight:900;margin-bottom:12px}.brand{width:34px;height:34px;border-radius:8px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;letter-spacing:.03em;flex:0 0 auto;background:var(--black)}.brand.flight{background:var(--ua)}.brand.car{background:var(--ent)}.brand.hotel{background:var(--hotel)}.flight-group{padding:12px 0;border-top:1px solid #dedfdb}.flight-group:first-of-type{border-top:0;padding-top:0}.flight-head{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:8px 14px;align-items:baseline}.flight-main{min-width:0;font-size:19px;font-weight:900;letter-spacing:-.3px;line-height:1.2}.flight-time{text-align:right;color:#4b4f55;font-size:16px;font-weight:800;line-height:1.25}.passenger-lines{margin-top:9px;display:grid;gap:6px}.passenger-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;color:#4f5358;font-size:14px;font-weight:800;line-height:1.25}.passenger-code{color:#151515;font-size:15px;font-weight:900;letter-spacing:.035em;white-space:nowrap}.single-main{font-size:20px;line-height:1.22;font-weight:900;letter-spacing:-.3px;margin-bottom:6px}.single-sub{color:#4d5157;font-size:17px;line-height:1.32;font-weight:700}.confirmation{margin-top:12px;font-size:20px;letter-spacing:.05em;font-weight:900}.detail-section{margin:14px 0}.accordion-card{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 8px 22px rgba(15,23,42,.045);overflow:hidden;margin-bottom:12px}.accordion-title{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--softline)}.accordion-title h3{margin:0;font-size:22px;line-height:1.05;font-weight:900;letter-spacing:-.5px}.accordion-title p{margin:3px 0 0;color:#5c6167;font-size:15px;font-weight:800}.detail-body{padding:14px 16px 16px}.detail-box{border-top:1px solid #ededeb;padding:10px 0;display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start}.detail-box:first-child{border-top:0;padding-top:0}.detail-key{color:#777b80;font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:900}.detail-val{color:#171717;font-size:15px;line-height:1.35;font-weight:800}.split-detail{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini-tile{background:#f7f7f5;border:1px solid var(--softline);border-radius:16px;padding:12px}.mini-label{color:#777b80;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;margin-bottom:6px}.mini-main{font-size:16px;font-weight:900;line-height:1.25}.mini-sub{margin-top:3px;color:#565b61;font-size:14px;font-weight:800;line-height:1.3}.schedule-item{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:96px 1fr;gap:12px;box-shadow:0 6px 18px rgba(15,23,42,.035)}.schedule-time{font-size:18px;font-weight:900;letter-spacing:-.25px}.schedule-date{color:#777b80;font-size:12px;font-weight:800;margin-top:3px}.schedule-title{font-size:18px;font-weight:900;letter-spacing:-.25px}.schedule-sub{color:#555a60;margin-top:4px;font-size:14px;font-weight:700;line-height:1.35}.empty{background:var(--panel);border:1px dashed #c8cac7;border-radius:20px;padding:16px;color:#70757a;text-align:center;font-weight:800}.status{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;color:#70757a;text-align:center;font-weight:800}.error{background:#fff2f0;border-color:#ffc9c2;color:#b42318}.footer{text-align:center;color:#8b9095;font-size:12px;font-weight:700;margin:18px 0 8px}@media(max-width:720px){.wrap{padding:10px}.topbar{border-radius:20px;padding:14px}.topline{display:block}h1{font-size:28px}.date-range{font-size:15px;margin-top:6px}.executive{border-radius:24px;padding:14px}.info-tile{padding:12px;min-height:104px}.tile-main{font-size:20px}.tile-sub{font-size:15px}.flight-head{grid-template-columns:1fr;gap:3px}.flight-time{text-align:left;font-size:15px}.detail-box{grid-template-columns:1fr;gap:3px}.schedule-item{grid-template-columns:1fr}.split-detail{grid-template-columns:1fr}}@media(max-width:430px){.tile-main{font-size:19px}.single-main{font-size:19px}.single-sub{font-size:16px}.section-head h2{font-size:23px}.passenger-line{font-size:13px}.passenger-code{font-size:14px}}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.topbar,.executive,.accordion-card,.schedule-item{box-shadow:none;break-inside:avoid}.footer{display:none}}
</style>
</head>
<body><main class="wrap"><div id="app" class="status">Loading travel dashboard…</div></main>
<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzn6c3le10KvB6YX6P62eNvnf2SU9zwE7P1pQaADgOTmnUXuFuwOw50dOUet21N2CGu/exec";
const params = new URLSearchParams(window.location.search);
const tripId = params.get("trip") || params.get("tripId") || "test-trip";
function val(x){return x===undefined||x===null?"":String(x).trim()}
function has(x){return val(x).length>0}
function esc(x){return val(x).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function formatDate(dateStr, includeYear=true){const s=val(dateStr);if(!s)return "";const p=s.split("-");if(p.length===3){const d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:includeYear?"numeric":undefined})}return s}
function compactDate(dateStr){const s=val(dateStr);if(!s)return "";const p=s.split("-");if(p.length===3){const d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}return s}
function tripRange(start,end){const a=compactDate(start),b=compactDate(end);if(a&&b&&a!==b)return `${a} – ${b}, ${val(start).slice(0,4)}`;return a||b||""}
function dateRange(start,end){const a=formatDate(start),b=formatDate(end);if(a&&b&&a!==b)return `${a} – ${b}`;return a||b||""}
function nights(start,end){const a=val(start).split("-"),b=val(end).split("-");if(a.length!==3||b.length!==3)return "";const d1=new Date(Number(a[0]),Number(a[1])-1,Number(a[2]));const d2=new Date(Number(b[0]),Number(b[1])-1,Number(b[2]));const n=Math.round((d2-d1)/(1000*60*60*24));return n>0?`${n} night${n===1?"":"s"}`:""}
function flightTitle(f){return [f.airline,f.flightNumber].filter(has).join(" ")}
function route(f){return [f.fromCode,f.toCode].filter(has).join(" → ")}
function initialsName(name){const s=val(name).replace(/;/g,",").trim();if(!s)return "";return s.split(",").map(part=>part.trim()).filter(Boolean).map(part=>{const words=part.split(/\s+/).filter(Boolean);if(words.length===1)return words[0];const first=words[0][0]||"";const last=words[words.length-1];return `${first}. ${last}`}).join(" / ")}
function cleanLocation(x){let s=val(x);if(!s)return "";const m=s.match(/\b[A-Z]{3}\b/);if(m)return m[0];s=s.replace(/\+?\d[\d\s().-]{7,}/g,"").replace(/\s+/g," ").trim();if(s.length>28)s=s.split(",")[0];return s}
function groupFlights(flights){const map=new Map();flights.forEach(f=>{const key=[f.date,f.airline,f.flightNumber,f.fromCode,f.toCode,f.departTime,f.arriveTime].map(val).join("|");if(!map.has(key))map.set(key,{base:f,items:[]});map.get(key).items.push(f)});return [...map.values()]}
function passengerLine(f){const who=initialsName(f.traveler)||initialsName(f.notes)||"";const pieces=[];if(has(f.confirmation))pieces.push(esc(f.confirmation));if(has(f.seat))pieces.push(`Seat ${esc(f.seat)}`);if(!who&&!pieces.length)return "";return `<div class="passenger-line"><span>${esc(who||"Traveler")}</span><span class="passenger-code">${pieces.join(" · ")}</span></div>`}
function renderFlightSummary(flights){if(!flights.length)return "";const airline=flights[0].airline||"Flight";const groups=groupFlights(flights);return `<div class="big-card"><div class="card-label"><span class="brand flight">${esc((airline||"FL").slice(0,2).toUpperCase())}</span><span>Flights · ${esc(airline)}</span></div>${groups.map(g=>{const f=g.base;return `<div class="flight-group"><div class="flight-head"><div class="flight-main">${esc(f.flightNumber||flightTitle(f))} · ${esc(route(f))}</div><div class="flight-time">${esc(compactDate(f.date))}${has(f.departTime)?" · "+esc(f.departTime):""}${has(f.arriveTime)?" → "+esc(f.arriveTime):""}</div></div><div class="passenger-lines">${g.items.map(passengerLine).filter(Boolean).join("")}</div></div>`}).join("")}</div>`}
function renderCarSummary(cars){if(!cars.length)return "";return cars.map(c=>{const company=c.company||"Rental";const pick=cleanLocation(c.pickupLocation)||"Pickup";const ret=cleanLocation(c.returnLocation)||"Return";const vehicle=val(c.notes)||val(c.carClass);const vehicleLine=vehicle?`${esc(vehicle)} · `:"";return `<div class="big-card"><div class="card-label"><span class="brand car">${esc((company||"CAR").slice(0,3).toUpperCase())}</span><span>Rental Car · ${esc(company)}</span></div><div class="single-main">${vehicleLine}${esc(pick)} pickup${has(ret)?" → "+esc(ret)+" return":""}</div><div class="single-sub">${esc(compactDate(c.pickupDate))}${has(c.pickupTime)?", "+esc(c.pickupTime):""}${has(pick)?" ("+esc(pick)+")":""}${(has(c.returnDate)||has(c.returnTime))?" → "+esc(compactDate(c.returnDate))+(has(c.returnTime)?", "+esc(c.returnTime):"")+(has(ret)?" ("+esc(ret)+")":""):""}</div>${has(c.confirmation)?`<div class="confirmation">${esc(c.confirmation)}</div>`:""}</div>`}).join("")}
function renderHotelSummary(hotels){if(!hotels.length)return "";return hotels.map(h=>`<div class="big-card"><div class="card-label"><span class="brand hotel">HTL</span><span>Hotel · Lodging</span></div><div class="single-main">${esc(h.hotelName||"Hotel")}</div><div class="single-sub">${esc(dateRange(h.checkInDate,h.checkOutDate))}${has(h.roomType)?" · "+esc(h.roomType):""}${has(h.address)?"<br>"+esc(h.address):""}${has(h.phone)?" · "+esc(h.phone):""}</div>${has(h.confirmation)?`<div class="confirmation">${esc(h.confirmation)}</div>`:""}</div>`).join("")}
function detailRow(k,v){return has(v)?`<div class="detail-box"><div class="detail-key">${esc(k)}</div><div class="detail-val">${esc(v)}</div></div>`:""}
function detailSection(title,sub,brand,rows){return `<div class="accordion-card"><div class="accordion-title"><span class="brand ${brand.cls||""}">${esc(brand.text)}</span><div><h3>${esc(title)}</h3><p>${esc(sub||"")}</p></div></div><div class="detail-body">${rows.join("")}</div></div>`}
function renderFlightDetails(flights){if(!flights.length)return "";return `<section class="detail-section">${flights.map(f=>detailSection(flightTitle(f)||"Flight",route(f),{text:(f.airline||"FL").slice(0,2).toUpperCase(),cls:"flight"},[detailRow("Traveler",f.traveler),detailRow("Direction",f.direction),detailRow("Date",formatDate(f.date)),detailRow("Route",route(f)),detailRow("Departure",[f.fromCity,f.departTime].filter(has).join(" · ")),detailRow("Arrival",[f.toCity,f.arriveTime].filter(has).join(" · ")),detailRow("Confirmation",f.confirmation),detailRow("Seat",f.seat),detailRow("Notes",f.notes)])).join("")}</section>`}
function renderCarDetails(cars){if(!cars.length)return "";return `<section class="detail-section">${cars.map(c=>{const company=c.company||"Rental Car";const pick=cleanLocation(c.pickupLocation)||c.pickupLocation;const ret=cleanLocation(c.returnLocation)||c.returnLocation;const vehicle=val(c.notes)||val(c.carClass);return `<div class="accordion-card"><div class="accordion-title"><span class="brand car">${esc((company||"CAR").slice(0,3).toUpperCase())}</span><div><h3>Rental Car</h3><p>${esc(company)}</p></div></div><div class="detail-body"><div class="split-detail"><div class="mini-tile"><div class="mini-label">Pickup</div><div class="mini-main">${esc(formatDate(c.pickupDate))}${has(c.pickupTime)?" · "+esc(c.pickupTime):""}</div><div class="mini-sub">${esc(pick)}</div></div><div class="mini-tile"><div class="mini-label">Return</div><div class="mini-main">${esc(formatDate(c.returnDate))}${has(c.returnTime)?" · "+esc(c.returnTime):""}</div><div class="mini-sub">${esc(ret)}</div></div></div>${detailRow("Confirmation",c.confirmation)}${detailRow("Vehicle",vehicle)}${detailRow("Car Class",c.carClass&&c.carClass!==vehicle?c.carClass:"")}</div></div>`}).join("")}</section>`}
function renderHotelDetails(hotels){if(!hotels.length)return "";return `<section class="detail-section">${hotels.map(h=>detailSection("Hotel / Lodging",h.hotelName,{text:"HTL",cls:"hotel"},[detailRow("Confirmation",h.confirmation),detailRow("Dates",dateRange(h.checkInDate,h.checkOutDate)),detailRow("Address",h.address),detailRow("Phone",h.phone),detailRow("Room Type",h.roomType),detailRow("Notes",h.notes)])).join("")}</section>`}
function renderSchedule(schedule){return `<section class="detail-section"><div class="accordion-title" style="border:0;padding:14px 2px 10px"><span class="iconbox" style="width:44px;height:44px;font-size:23px">🗓️</span><div><h3>Daily Schedule</h3><p>Optional activities and notes</p></div></div>${schedule.length?schedule.map(s=>`<div class="schedule-item"><div><div class="schedule-time">${esc(s.time)}</div><div class="schedule-date">${esc(formatDate(s.date,false))}</div></div><div><div class="schedule-title">${esc(s.title)}</div><div class="schedule-sub">${[s.location,s.type].filter(has).map(esc).join(" · ")}</div>${has(s.notes)?`<div class="schedule-sub">${esc(s.notes)}</div>`:""}</div></div>`).join(""):`<div class="empty">No daily schedule items added yet.</div>`}</section>`}
function renderNotes(notes){if(!notes.length)return "";return `<section class="detail-section">${notes.map(n=>detailSection(n.title||"Note",n.category,{text:"NT",cls:""},[detailRow("Note",n.note)])).join("")}</section>`}
function render(data){const trip=data.trip||{},flights=data.flights||[],cars=data.rentalCars||[],hotels=data.hotels||[],schedule=data.schedule||[],notes=data.notes||[];if(!data.trip){document.getElementById("app").className="status error";document.getElementById("app").innerHTML=`Trip not found for <strong>${esc(tripId)}</strong>. Check the Trips tab and tripId.`;return}document.getElementById("app").className="";document.getElementById("app").innerHTML=`<div class="topbar"><div class="topline"><h1>${esc(trip.tripName||trip.primaryCity||"Trip")}</h1><div class="date-range">${esc(tripRange(trip.startDate,trip.endDate))}</div></div><div class="subline">${esc([trip.primaryCity,trip.traveler].filter(has).join(" · ")||trip.subtitle||"")}</div></div><section class="executive"><div class="section-head"><div class="iconbox">📋</div><div><h2>Executive Summary</h2><p>All bookings at a glance</p></div></div><div class="summary-grid"><div class="info-tile"><div class="eyebrow">Trip Dates</div><div class="tile-main">${esc(tripRange(trip.startDate,trip.endDate))}</div><div class="tile-sub">${esc([nights(trip.startDate,trip.endDate),trip.primaryCity].filter(has).join(" · "))}</div></div><div class="info-tile"><div class="eyebrow">Traveler</div><div class="tile-main">${esc(initialsName(trip.traveler)||trip.traveler||"Stan")}</div><div class="tile-sub">${esc(trip.subtitle||"")}</div></div></div>${renderFlightSummary(flights)}${renderCarSummary(cars)}${renderHotelSummary(hotels)}${(!flights.length&&!cars.length&&!hotels.length)?`<div class="empty">No reservation details added yet.</div>`:""}</section>${renderFlightDetails(flights)}${renderCarDetails(cars)}${renderHotelDetails(hotels)}${renderSchedule(schedule)}${renderNotes(notes)}<div class="footer">Travel dashboard powered by GitHub Pages + Google Sheets</div>`}
async function loadTrip(){try{const url=`${WEB_APP_URL}?action=trip&tripId=${encodeURIComponent(tripId)}`;const res=await fetch(url);if(!res.ok)throw new Error("Network response was not ok");const json=await res.json();if(!json.ok)throw new Error(json.error||"Unknown error");render(json.data)}catch(err){document.getElementById("app").className="status error";document.getElementById("app").innerHTML=`Could not load trip data.<br><br>${esc(err.message)}`;}}
function travelLogoFor(name, type){
 const s = val(name).toLowerCase();

 if(type === "flight"){
  if(s.includes("united")) return "assets/logos/united.svg";
 }

 if(type === "car"){
  if(s.includes("enterprise")) return "assets/logos/enterprise.svg";
 }

 if(type === "hotel"){
  if(s.includes("marriott")) return "assets/logos/marriott.svg";
  if(s.includes("fairfield")) return "assets/logos/marriott.svg";
  if(s.includes("courtyard")) return "assets/logos/marriott.svg";
  if(s.includes("residence inn")) return "assets/logos/marriott.svg";
  if(s.includes("springhill")) return "assets/logos/marriott.svg";
  if(s.includes("towneplace")) return "assets/logos/marriott.svg";
  if(s.includes("sheraton")) return "assets/logos/marriott.svg";
  if(s.includes("westin")) return "assets/logos/marriott.svg";
 }

 return "";
}

function applyTravelLogos(data){
 if(!document.getElementById("travel-logo-style")){
  const style = document.createElement("style");
  style.id = "travel-logo-style";
  style.textContent = `
   .brand.logo-brand{
    width:82px !important;
    height:34px !important;
    min-width:82px !important;
    padding:4px 7px !important;
    background:#ffffff !important;
    border:1px solid #dcdedb !important;
    color:transparent !important;
    box-shadow:0 1px 4px rgba(15,23,42,.06);
   }
   .brand.logo-brand img{
    max-width:68px;
    max-height:24px;
    width:auto;
    height:auto;
    display:block;
    object-fit:contain;
   }
  `;
  document.head.appendChild(style);
 }

 function replaceBrand(el, name, type){
  if(!el) return;
  const logo = travelLogoFor(name, type);
  if(!logo) return;

  el.classList.add("logo-brand");
  el.innerHTML = `<img src="${logo}" alt="${esc(name)} logo">`;
 }

 const flights = data.flights || [];
 const cars = data.rentalCars || [];
 const hotels = data.hotels || [];

 const flightName = flights.length ? flights[0].airline : "";
 const carName = cars.length ? cars[0].company : "";
 const hotelName = hotels.length ? hotels[0].hotelName : "";

 document.querySelectorAll(".card-label .brand.flight").forEach(el => replaceBrand(el, flightName, "flight"));
 document.querySelectorAll(".card-label .brand.car").forEach(el => replaceBrand(el, carName, "car"));
 document.querySelectorAll(".card-label .brand.hotel").forEach(el => replaceBrand(el, hotelName, "hotel"));

 const flightDetailBrands = document.querySelectorAll(".accordion-title .brand.flight");
 flightDetailBrands.forEach((el, index) => {
  const f = flights[index] || flights[0] || {};
  replaceBrand(el, f.airline || flightName, "flight");
 });

 const carDetailBrands = document.querySelectorAll(".accordion-title .brand.car");
 carDetailBrands.forEach((el, index) => {
  const c = cars[index] || cars[0] || {};
  replaceBrand(el, c.company || carName, "car");
 });

 const hotelDetailBrands = document.querySelectorAll(".accordion-title .brand.hotel");
 hotelDetailBrands.forEach((el, index) => {
  const h = hotels[index] || hotels[0] || {};
  replaceBrand(el, h.hotelName || hotelName, "hotel");
 });
}

const originalRenderWithLogos = render;
render = function(data){
 originalRenderWithLogos(data);
 applyTravelLogos(data);
};
  loadTrip();
</script></body></html>
