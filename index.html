<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stan Travel Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f4f5f4;--card:#fff;--ink:#171717;--muted:#6f7377;--line:#dedfdd;--soft:#f7f8f7;--deep:#1f2a37;--shadow:0 10px 30px rgba(15,23,42,.06)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:960px;margin:0 auto;padding:16px}
    .hero{background:linear-gradient(135deg,#fff 0%,#f8f8f6 100%);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px}
    .eyebrow{display:inline-flex;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;color:#555;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
    h1{font-size:36px;line-height:1.02;margin:0;letter-spacing:-1.4px;font-weight:800}
    .subtitle{margin-top:10px;color:var(--muted);font-size:16px;line-height:1.45}
    .date-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
    .date-box,.meta{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:14px}
    .label{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
    .value{font-size:17px;font-weight:800;color:var(--ink)}
    .section{margin:14px 0}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 4px 10px}
    .section-title h2{margin:0;font-size:22px;letter-spacing:-.4px;font-weight:800}
    .summary-card,.detail-card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:18px;margin-bottom:12px}
    .summary-header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
    .summary-header h3{margin:0;font-size:19px;line-height:1.15;font-weight:800;letter-spacing:-.3px}
    .badge{border-radius:999px;background:#111827;color:#fff;font-size:11px;font-weight:800;padding:6px 9px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
    .flight-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:14px;background:var(--soft);border:1px solid var(--line);border-radius:20px;margin-top:8px}
    .airport{font-size:24px;font-weight:800;letter-spacing:-.6px}.city{color:var(--muted);font-size:12px;font-weight:700;margin-top:1px}.time{margin-top:5px;font-size:15px;font-weight:800}.arrow{color:#9aa0a6;font-size:22px;font-weight:800}
    .meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.meta .value{font-size:15px;line-height:1.25;overflow-wrap:anywhere}
    .detail-card h3{margin:0 0 10px;font-size:18px;letter-spacing:-.2px}.detail-list{display:grid;gap:8px}
    .detail-line{display:grid;grid-template-columns:120px 1fr;gap:10px;border-top:1px solid #eeeeeb;padding-top:9px;font-size:14px}.detail-line:first-child{border-top:0;padding-top:0}.detail-key{color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:11px}.detail-val{font-weight:700;line-height:1.35}
    .schedule-item{display:grid;grid-template-columns:90px 1fr;gap:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}.schedule-time{font-weight:800;color:#111827}.schedule-title{font-weight:800;font-size:16px}.schedule-sub{margin-top:3px;color:var(--muted);font-size:13px;line-height:1.35}
    .empty{background:#fff;border:1px dashed #c9cbc8;color:var(--muted);border-radius:22px;padding:18px;text-align:center;font-weight:700}.status{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center;color:var(--muted);font-weight:700;margin-top:20px}.error{color:#b42318;background:#fff2f0;border-color:#ffc9c2}
    .print-note{color:var(--muted);font-size:12px;text-align:center;margin:20px 0 6px}
    @media(max-width:720px){.wrap{padding:12px}.hero{border-radius:24px;padding:18px}h1{font-size:31px}.date-strip,.meta-grid{grid-template-columns:1fr}.flight-row{grid-template-columns:1fr;text-align:left}.arrow{display:none}.detail-line{grid-template-columns:1fr;gap:3px}.schedule-item{grid-template-columns:1fr}}
    @media print{body{background:#fff}.wrap{max-width:none;padding:0}.hero,.summary-card,.detail-card,.schedule-item{box-shadow:none;break-inside:avoid}.print-note{display:none}}
  </style>
</head>
<body>
<main class="wrap"><div id="app" class="status">Loading travel dashboard…</div></main>
<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzn6c3le10KvB6YX6P62eNvnf2SU9zwE7P1pQaADgOTmnUXuFuwOw50dOUet21N2CGu/exec";
const params = new URLSearchParams(window.location.search);
const tripId = params.get("trip") || params.get("tripId") || "test-trip";
function val(x){return x===undefined||x===null?"":String(x).trim()}
function has(x){return val(x).length>0}
function esc(x){return val(x).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function formatDate(dateStr){const s=val(dateStr); if(!s)return ""; const p=s.split("-"); if(p.length===3){const d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"})} return s}
function dateRange(start,end){const a=formatDate(start), b=formatDate(end); if(a&&b&&a!==b)return `${a} – ${b}`; return a||b||""}
function flightTitle(f){return [f.airline,f.flightNumber].filter(has).join(" ")}
function renderFlightSummary(f){return `<div class="summary-card"><div class="summary-header"><h3>${esc(f.direction||"Flight")}</h3><span class="badge">${esc(flightTitle(f)||"Flight")}</span></div><div class="flight-row"><div><div class="airport">${esc(f.fromCode)}</div><div class="city">${esc(f.fromCity)}</div><div class="time">${esc(formatDate(f.date))} · ${esc(f.departTime)}</div></div><div class="arrow">→</div><div><div class="airport">${esc(f.toCode)}</div><div class="city">${esc(f.toCity)}</div><div class="time">${esc(f.arriveTime)}</div></div></div><div class="meta-grid">${has(f.confirmation)?`<div class="meta"><div class="label">Confirmation</div><div class="value">${esc(f.confirmation)}</div></div>`:""}${has(f.airline)?`<div class="meta"><div class="label">Airline</div><div class="value">${esc(f.airline)}</div></div>`:""}</div></div>`}
function renderCarSummary(c){return `<div class="summary-card"><div class="summary-header"><h3>Rental Car</h3><span class="badge">${esc(c.company||"Rental")}</span></div><div class="meta-grid"><div class="meta"><div class="label">Pickup</div><div class="value">${esc(formatDate(c.pickupDate))}${has(c.pickupTime)?" · "+esc(c.pickupTime):""}${has(c.pickupLocation)?"<br>"+esc(c.pickupLocation):""}</div></div><div class="meta"><div class="label">Return</div><div class="value">${esc(formatDate(c.returnDate))}${has(c.returnTime)?" · "+esc(c.returnTime):""}${has(c.returnLocation)?"<br>"+esc(c.returnLocation):""}</div></div>${has(c.confirmation)?`<div class="meta"><div class="label">Confirmation</div><div class="value">${esc(c.confirmation)}</div></div>`:""}${has(c.carClass)?`<div class="meta"><div class="label">Car Class</div><div class="value">${esc(c.carClass)}</div></div>`:""}</div></div>`}
function renderHotelSummary(h){return `<div class="summary-card"><div class="summary-header"><h3>Hotel / Lodging</h3><span class="badge">${esc(h.hotelName||"Hotel")}</span></div><div class="meta-grid">${has(h.confirmation)?`<div class="meta"><div class="label">Confirmation</div><div class="value">${esc(h.confirmation)}</div></div>`:""}${has(h.phone)?`<div class="meta"><div class="label">Phone</div><div class="value">${esc(h.phone)}</div></div>`:""}<div class="meta"><div class="label">Dates</div><div class="value">${esc(dateRange(h.checkInDate,h.checkOutDate))}</div></div>${has(h.address)?`<div class="meta"><div class="label">Address</div><div class="value">${esc(h.address)}</div></div>`:""}</div></div>`}
function detailCard(title,rows){const lines=rows.filter(r=>has(r[1])).map(r=>`<div class="detail-line"><div class="detail-key">${esc(r[0])}</div><div class="detail-val">${esc(r[1])}</div></div>`).join("");return `<div class="detail-card"><h3>${esc(title)}</h3><div class="detail-list">${lines}</div></div>`}
function renderFlightDetails(flights){if(!flights.length)return "";return `<section class="section"><div class="section-title"><h2>Flight Details</h2></div>${flights.map(f=>detailCard(flightTitle(f)||"Flight",[["Direction",f.direction],["Date",formatDate(f.date)],["Route",[f.fromCode,f.toCode].filter(has).join(" → ")],["Departure",[f.fromCity,f.departTime].filter(has).join(" · ")],["Arrival",[f.toCity,f.arriveTime].filter(has).join(" · ")],["Confirmation",f.confirmation],["Notes",f.notes]])).join("")}</section>`}
function renderCarDetails(cars){if(!cars.length)return "";return `<section class="section"><div class="section-title"><h2>Rental Car Details</h2></div>${cars.map(c=>detailCard(c.company||"Rental Car",[["Confirmation",c.confirmation],["Pickup",[formatDate(c.pickupDate),c.pickupTime,c.pickupLocation].filter(has).join(" · ")],["Return",[formatDate(c.returnDate),c.returnTime,c.returnLocation].filter(has).join(" · ")],["Car Class",c.carClass],["Notes",c.notes]])).join("")}</section>`}
function renderHotelDetails(hotels){if(!hotels.length)return "";return `<section class="section"><div class="section-title"><h2>Hotel / Lodging Details</h2></div>${hotels.map(h=>detailCard(h.hotelName||"Hotel",[["Confirmation",h.confirmation],["Dates",dateRange(h.checkInDate,h.checkOutDate)],["Address",h.address],["Phone",h.phone],["Room Type",h.roomType],["Notes",h.notes]])).join("")}</section>`}
function renderSchedule(schedule){if(!schedule.length)return `<section class="section"><div class="section-title"><h2>Daily Schedule</h2></div><div class="empty">No daily schedule items added yet.</div></section>`;return `<section class="section"><div class="section-title"><h2>Daily Schedule</h2></div>${schedule.map(s=>`<div class="schedule-item"><div><div class="schedule-time">${esc(s.time)}</div><div class="city">${esc(formatDate(s.date))}</div></div><div><div class="schedule-title">${esc(s.title)}</div><div class="schedule-sub">${[s.location,s.type].filter(has).map(esc).join(" · ")}</div>${has(s.notes)?`<div class="schedule-sub">${esc(s.notes)}</div>`:""}</div></div>`).join("")}</section>`}
function renderNotes(notes){if(!notes.length)return "";return `<section class="section"><div class="section-title"><h2>Notes</h2></div>${notes.map(n=>detailCard(n.title||n.category||"Note",[["Category",n.category],["Note",n.note]])).join("")}</section>`}
function render(data){const trip=data.trip||{}, flights=data.flights||[], cars=data.rentalCars||[], hotels=data.hotels||[], schedule=data.schedule||[], notes=data.notes||[]; if(!data.trip){document.getElementById("app").className="status error";document.getElementById("app").innerHTML=`Trip not found for <strong>${esc(tripId)}</strong>. Check the Trips tab and tripId.`;return} document.getElementById("app").className="";document.getElementById("app").innerHTML=`<header class="hero"><div class="eyebrow">Executive Travel Itinerary</div><h1>${esc(trip.tripName||trip.primaryCity||"Trip")}</h1><div class="subtitle">${esc(trip.subtitle||"")}</div><div class="date-strip"><div class="date-box"><div class="label">Trip Dates</div><div class="value">${esc(dateRange(trip.startDate,trip.endDate))}</div></div><div class="date-box"><div class="label">Traveler</div><div class="value">${esc(trip.traveler||"Stan")}</div></div></div></header><section class="section"><div class="section-title"><h2>Executive Summary</h2></div>${flights.map(renderFlightSummary).join("")}${cars.map(renderCarSummary).join("")}${hotels.map(renderHotelSummary).join("")}${(!flights.length&&!cars.length&&!hotels.length)?`<div class="empty">No reservation details added yet.</div>`:""}</section>${renderFlightDetails(flights)}${renderCarDetails(cars)}${renderHotelDetails(hotels)}${renderSchedule(schedule)}${renderNotes(notes)}<div class="print-note">Travel dashboard powered by GitHub Pages + Google Sheets</div>`}
async function loadTrip(){try{const url=`${WEB_APP_URL}?action=trip&tripId=${encodeURIComponent(tripId)}`;const res=await fetch(url);if(!res.ok)throw new Error("Network response was not ok");const json=await res.json();if(!json.ok)throw new Error(json.error||"Unknown error");render(json.data)}catch(err){document.getElementById("app").className="status error";document.getElementById("app").innerHTML=`Could not load trip data.<br><br>${esc(err.message)}`}}
loadTrip();
</script>
</body>
</html>
